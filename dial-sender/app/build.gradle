plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Chaquopy's buildPython, resolved rather than hardcoded.
//
// This used to point straight at ~/.local/python-standalone/bin/python3.12,
// which exists on the dev machine and nowhere else — on a GitHub runner
// user.home is /home/runner, so the release workflow failed with "does not
// appear to be a valid Python command".
//
// Chaquopy 15.0.1 cannot use Python 3.13+: it imports the stdlib `cgi` module,
// which was removed there, and dies with ModuleNotFoundError. A bare `python3`
// is therefore not safe to assume — on this dev machine it is 3.14. So the
// named interpreters are tried newest-supported first, and plain `python3` is
// only the last resort.
def chaquopyBuildPython = {
    def explicit = project.findProperty("buildPython")
    if (explicit) {
        return explicit.toString()
    }
    def standalone = new File(System.getProperty("user.home"),
                              ".local/python-standalone/bin/python3.12")
    if (standalone.canExecute()) {
        return standalone.absolutePath
    }
    for (name in ["python3.12", "python3.11", "python3.10", "python3.9", "python3.8"]) {
        for (dir in (System.getenv("PATH") ?: "").split(File.pathSeparator)) {
            if (new File(dir, name).canExecute()) {
                return name
            }
        }
    }
    return "python3"
}()

android {
    namespace "com.example.dialsender"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dialsender"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            version "3.8"
            buildPython chaquopyBuildPython
            pip {
                install "Pillow"
                install "numpy"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Include the repository-level `dials` folder as app assets so preset dials
    // placed in the workspace `dials/` directory are packaged under assets/dials
    sourceSets {
        main {
            assets.srcDirs += file("$rootDir/dials")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // CameraX — in-app camera with remote (watch) shutter
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
