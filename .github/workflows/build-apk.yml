name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dial-sender

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Chaquopy 15.0.1 needs a build-time Python and cannot use 3.13+, which
      # dropped the stdlib `cgi` module it imports. Pinned and passed to Gradle
      # explicitly so it does not depend on which python3 wins on PATH.
      - name: Set up Python for Chaquopy
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PbuildPython="${{ steps.py.outputs.python-path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dial-sender-debug-apk
          path: dial-sender/app/build/outputs/apk/debug/app-debug.apk
