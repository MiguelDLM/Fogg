name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Chaquopy 15.0.1 needs a build-time Python and cannot use 3.13+, which
    # dropped the stdlib `cgi` module it imports. Pinned and passed to Gradle
    # explicitly so it does not depend on which python3 wins on PATH.
    - name: Set up Python for Chaquopy
      id: py
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: dial-sender

    - name: Build with Gradle
      run: ./gradlew assembleDebug -PbuildPython="${{ steps.py.outputs.python-path }}"
      working-directory: dial-sender

    - name: Rename APK
      run: mv dial-sender/app/build/outputs/apk/debug/app-debug.apk dial-sender-${{ github.ref_name }}.apk

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dial-sender-${{ github.ref_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
